name: Poll odds

# Cadence lives in cadence.json, NOT here. GitHub will not schedule a workflow
# more often than every 5 minutes, so a cron of "*/3" is not an option. The
# workflow starts a run and runner.py does its own clock-anchored loop inside
# it -- which is how the 3 / 5 / 10-minute experiment gets real 3-minute polls.
# Changing the cadence means editing cadence.json; this file stays untouched.
#
# The cron below is now only a fallback. Measured in production 2026-07-30,
# GitHub ran this schedule 4 times in 19 hours instead of 38, and the two
# following slots (17:07 and 17:37, deliberately moved off the busy :00/:30
# minutes) were skipped as well. Manually started runs, by contrast, have begun
# immediately every single time. So the run keeps itself going instead: the
# last step asks GitHub to start the next one.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

# pages/id-token are needed by actions/deploy-pages below; contents stays
# read-only because the dashboard is published as a Pages artifact rather than
# committed back to the repo (no commit noise, no push loop).
permissions:
  contents: read
  pages: write
  id-token: write

# QUEUE the next run, never cancel the current one.
#
# This was `cancel-in-progress: true` and it quietly broke the whole chain.
# Each run dispatches its successor in its final step, so the successor starts
# while the predecessor is still doing its Post steps -- and the Post steps are
# where the SQLite cache gets SAVED. Cancelling there threw away the poll
# history every single cycle. Measured 2026-07-31: runs 38, 39, 40, 41 and 42
# were all marked "cancelled", each killed by its own successor, 25 minutes
# apart like clockwork.
#
# With `false` the successor waits in the queue for a few seconds until the
# predecessor has finished writing, then starts. Runs still cannot overlap --
# that is what the group does -- but nothing gets killed mid-write. A hung run
# is bounded by timeout-minutes below, so the queue cannot grow forever.
concurrency:
  group: poll-odds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # The loop stops itself 2.5 minutes before the next window; this is only a
    # hard backstop in case a single poll hangs on a slow API call.
    # Poll window (up to ~27.5 min) plus the hold that paces the chain.
    # Usually the two are complements -- the later a poll finishes, the less
    # the hold waits -- but a run that finishes right ON a boundary now skips
    # to the next one, so the worst case really is both at once: 27.5 + 32.
    # 65 covers that with room for a slow deploy, and still bounds a wedged run.
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/cache silently skips the save step if the exact key already
      # exists -- with a fixed key that means the DB would only ever get saved
      # once, and every run after that would "restore" the same stale snapshot
      # forever (spike detection needs the previous run's prices, so this
      # matters). Keying on the run id makes every save unique; restore-keys
      # falls back to the most recent previous run's cache.
      #
      # The prefix has been bumped twice, both times deliberately and both
      # times written down here rather than done quietly:
      #   -v2- (2026-07-29) when the strategy split went live.
      #   -v3- (2026-07-30) after the entry rule was fixed. Six of the nine
      #        signals logged under -v2- came from the bug that let
      #        "был 3.20, ставим за 1.87" through, and publishing a win rate
      #        measured on a bug we had already removed would be worse than
      #        starting over with nine signals lost.
      #   -v4- (2026-08-01) full restart, asked for explicitly. What counts as
      #        a signal changed on every axis in one day: the threshold went
      #        10 -> 8 -> 10, breadth stopped meaning "how many books quote"
      #        and started meaning "how many books moved", the price band
      #        narrowed to 1.55-5.50, and a move is now measured over an hour
      #        instead of over one poll. Rows logged under any of those rules
      #        cannot be compared with rows logged under these, so the record
      #        starts clean rather than mixing five definitions in one table.
      #   -v5- (2026-08-08) full restart, asked for explicitly: "перезалей стату
      #        заново, чтобы везде были нули, и я смог посмотреть результат с
      #        чистого листа". What counts as a signal changed on three axes the
      #        same day -- the confidence floor rose to three stars, the price
      #        ceiling came down from 5.5 to 5.0, and a 60-hour publishing
      #        horizon appeared. On top of that esports became gradeable for the
      #        first time, so the old rows are not merely looser than the new
      #        ones: part of that book was scored by a different instrument and
      #        part of it was never scored at all. Averaging the two together
      #        would make every number on the page mean nothing.
      # Schema changes do NOT justify a bump -- new columns arrive through
      # storage._migrate(). Only a change to what counts as a signal does.
      #   -v6- (2026-08-15) full restart, asked for explicitly: "всё-таки
      #        сбрасывать всю статистику с нуля, сбрасывать все ставки, всё что
      #        мы вели это всё время, и запускаться по новой". Unlike some
      #        earlier bumps this one is unarguable -- three separate things
      #        changed what a row in that table means, on the same day:
      #          * the confidence scale went from three rungs to four, and the
      #            counts behind each rung were re-cut;
      #          * the publishing floor dropped from three stars to two, so the
      #            table now contains a population it never contained before;
      #          * the feed widened from ~25 bookmakers (eu) to ~75
      #            (eu+uk+au+us), which moves every breadth count upward for
      #            the same real-world move.
      #        Any one of those makes old and new rows incomparable. Averaging
      #        them together would produce a win rate that describes no
      #        strategy that was ever run.
      - name: Restore odds history DB
        uses: actions/cache@v4
        with:
          path: data
          key: odds-history-v6-${{ github.run_id }}
          restore-keys: odds-history-v6-

      - run: pip install -r requirements.txt

      # One complete cycle against a stubbed provider, before a single credit
      # is spent. Added 2026-08-01 after a five-hour silent outage: detector.py
      # shipped calling a storage function that had been left out of the
      # upload, so every poll died on AttributeError. runner.py catches
      # per-poll exceptions, so the job stayed green while the site quietly
      # froze on its last good render -- the worst kind of failure, one that
      # looks like a calm market. Offline, costs nothing, and fails loudly.
      - name: Smoke test the pipeline before spending credits
        run: |
          python test_smoke.py
          python test_selection.py
          python test_grading.py
          python test_baseline_gap.py
          python test_consistency.py
          python test_budget.py
          # Added 2026-08-15 at Vladislav's request -- "пусть наши тестировщики
          # прогоняют логику написанного на сайте и логику вообще проекта".
          # The first pins the meaning of a signal so the region expansion
          # cannot silently redefine it; the second pins every rule the page
          # states in prose to the constant that governs it.
          python test_stars_invariance.py
          python test_site_claims.py

      - name: Poll the market for this window
        env:
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          # Second provider, esports + table tennis only. The secret already
          # existed from the original OddsPapi build; the same key now carries
          # the paid subscription, so nothing had to be re-issued.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep in sync with config.py's default -- an env var here silently
          # overrides it, and a stale value once left the dashboard telling
          # users one threshold while the code alerted on another.
          SPIKE_THRESHOLD_PCT: "0.10"
          RESULTS_CHECK_INTERVAL_HOURS: "3"
          # Deliberately NOT setting POLL_INTERVAL_MINUTES or
          # PUBLISH_INTERVAL_MINUTES: both now come from cadence.json, so that
          # file stays the single lever. Pinning the publish interval here was
          # what made a 20-minute cadence come out as an uneven 20/10 sawtooth,
          # because the run window still spanned 30 minutes.
        run: python runner.py

      # Publish the freshly-rendered dashboard/index.html to GitHub Pages.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # PUT A FLOOR UNDER THE CYCLE TIME. Measured 2026-08-08: the chain ran
      # away and burned 3 052 credits in 50 minutes -- a month's quota in under
      # two days.
      #
      # The mechanism: runner.py anchors its poll times to absolute clock
      # multiples (:00 and :30 at this cadence) and stops 2.5 minutes before
      # its window ends. A run that STARTS just after an anchor therefore has
      # no scheduled poll left inside its own window: it polls once on entry,
      # falls straight out of the loop in about 45 seconds, and the step below
      # asks for a successor -- which starts in the same band and does exactly
      # the same. Runs #712, #713, #715 and #716 took 55, 63, 54 and 47
      # seconds each. Nothing bounded how fast the chain could spin, because
      # until the outage no run had ever finished early.
      #
      # This wait is that bound. It sits AFTER the deploy deliberately: the
      # dashboard goes out the moment the poll is done, and only the REQUEST
      # for the next run waits. Anchored to the wall clock rather than to
      # elapsed time, so a chain knocked out of alignment walks back onto
      # :00/:30 by itself instead of drifting.
      - name: Hold until the next polling window opens
        if: always()
        run: |
          # Read the cadence from the same file everything else reads, so a
          # change there cannot leave the pacing behind on an old number.
          mins=$(python -c "from config import PUBLISH_INTERVAL_MINUTES as m; print(m)")
          echo "cadence.json says ${mins} min per window"
          period=$(( mins * 60 ))
          now=$(date -u +%s)
          # A small lead, so the successor is booting as the window opens
          # rather than a minute into it.
          target=$(( (now / period + 1) * period - 45 ))
          wait=$(( target - now ))
          # Observed on the very first cycle after this step shipped: because
          # the lead above makes each run START 44 seconds before a boundary,
          # the successor's own poll finishes AFTER that boundary has passed,
          # its wait computes as zero, and it dispatches instantly. The chain
          # settled into two runs per window -- one full-length, one 45-second
          # hop -- quietly doubling the credit burn. Not a runaway, but not the
          # once-per-window cadence the footer promises either. When the next
          # boundary is already this close, this run belongs to the window that
          # is ending, so hand over at the boundary after it.
          if [ "$wait" -lt 120 ]; then
            target=$(( target + period ))
            wait=$(( target - now ))
          fi
          [ "$wait" -lt 0 ] && wait=0
          # Never more than one window plus the grace above, whatever the
          # arithmetic does. Job timeout is sized to allow poll + this.
          [ "$wait" -gt "$(( period + 120 ))" ] && wait=$(( period + 120 ))
          echo "poll finished $(date -u +%H:%M:%S) UTC; holding ${wait}s so the"
          echo "next run starts on the window boundary instead of immediately"
          sleep "$wait"

      # Ask GitHub to start the next window, because the schedule above cannot
      # be relied on (see the note at the top of this file).
      #
      # This deliberately requires a token that is NOT the built-in
      # GITHUB_TOKEN: GitHub refuses to let a workflow start another workflow
      # with the built-in one, specifically so a chain like this cannot appear
      # by accident. Until a WORKFLOW_PAT secret exists this step prints a line
      # and exits, so merging it changes nothing on its own.
      #
      # To stop the chain: delete the WORKFLOW_PAT secret, or disable this
      # workflow in the Actions tab. Either takes effect on the next run.
      - name: Queue the next polling window
        if: always()
        env:
          GH_PAT: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "WORKFLOW_PAT is not set -- the cron schedule stays the only trigger."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/poll.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}")
          echo "next window requested, HTTP $status"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch.json
            echo "Could not queue the next run -- check that WORKFLOW_PAT is valid and has Actions: read and write on this repository."
          fi
