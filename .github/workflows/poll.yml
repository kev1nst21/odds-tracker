name: Poll odds

# Cadence lives in cadence.json, NOT here. GitHub will not schedule a workflow
# more often than every 5 minutes, so a cron of "*/3" is not an option. The
# workflow starts a run and runner.py does its own clock-anchored loop inside
# it -- which is how the 3 / 5 / 10-minute experiment gets real 3-minute polls.
# Changing the cadence means editing cadence.json; this file stays untouched.
#
# The cron below is now only a fallback. Measured in production 2026-07-30,
# GitHub ran this schedule 4 times in 19 hours instead of 38, and the two
# following slots (17:07 and 17:37, deliberately moved off the busy :00/:30
# minutes) were skipped as well. Manually started runs, by contrast, have begun
# immediately every single time. So the run keeps itself going instead: the
# last step asks GitHub to start the next one.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

# pages/id-token are needed by actions/deploy-pages below; contents stays
# read-only because the dashboard is published as a Pages artifact rather than
# committed back to the repo (no commit noise, no push loop).
permissions:
  contents: read
  pages: write
  id-token: write

# QUEUE the next run, never cancel the current one.
#
# This was `cancel-in-progress: true` and it quietly broke the whole chain.
# Each run dispatches its successor in its final step, so the successor starts
# while the predecessor is still doing its Post steps -- and the Post steps are
# where the SQLite cache gets SAVED. Cancelling there threw away the poll
# history every single cycle. Measured 2026-07-31: runs 38, 39, 40, 41 and 42
# were all marked "cancelled", each killed by its own successor, 25 minutes
# apart like clockwork.
#
# With `false` the successor waits in the queue for a few seconds until the
# predecessor has finished writing, then starts. Runs still cannot overlap --
# that is what the group does -- but nothing gets killed mid-write. A hung run
# is bounded by timeout-minutes below, so the queue cannot grow forever.
concurrency:
  group: poll-odds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # The loop stops itself 2.5 minutes before the next window; this is only a
    # hard backstop in case a single poll hangs on a slow API call.
    timeout-minutes: 32
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/cache silently skips the save step if the exact key already
      # exists -- with a fixed key that means the DB would only ever get saved
      # once, and every run after that would "restore" the same stale snapshot
      # forever (spike detection needs the previous run's prices, so this
      # matters). Keying on the run id makes every save unique; restore-keys
      # falls back to the most recent previous run's cache.
      #
      # The prefix has been bumped twice, both times deliberately and both
      # times written down here rather than done quietly:
      #   -v2- (2026-07-29) when the strategy split went live.
      #   -v3- (2026-07-30) after the entry rule was fixed. Six of the nine
      #        signals logged under -v2- came from the bug that let
      #        "был 3.20, ставим за 1.87" through, and publishing a win rate
      #        measured on a bug we had already removed would be worse than
      #        starting over with nine signals lost.
      #   -v4- (2026-08-01) full restart, asked for explicitly. What counts as
      #        a signal changed on every axis in one day: the threshold went
      #        10 -> 8 -> 10, breadth stopped meaning "how many books quote"
      #        and started meaning "how many books moved", the price band
      #        narrowed to 1.55-5.50, and a move is now measured over an hour
      #        instead of over one poll. Rows logged under any of those rules
      #        cannot be compared with rows logged under these, so the record
      #        starts clean rather than mixing five definitions in one table.
      # Schema changes do NOT justify a bump -- new columns arrive through
      # storage._migrate(). Only a change to what counts as a signal does.
      - name: Restore odds history DB
        uses: actions/cache@v4
        with:
          path: data
          key: odds-history-v4-${{ github.run_id }}
          restore-keys: odds-history-v4-

      - run: pip install -r requirements.txt

      # One complete cycle against a stubbed provider, before a single credit
      # is spent. Added 2026-08-01 after a five-hour silent outage: detector.py
      # shipped calling a storage function that had been left out of the
      # upload, so every poll died on AttributeError. runner.py catches
      # per-poll exceptions, so the job stayed green while the site quietly
      # froze on its last good render -- the worst kind of failure, one that
      # looks like a calm market. Offline, costs nothing, and fails loudly.
      - name: Smoke test the pipeline before spending credits
        run: python test_smoke.py

      - name: Poll the market for this window
        env:
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          # Second provider, esports + table tennis only. The secret already
          # existed from the original OddsPapi build; the same key now carries
          # the paid subscription, so nothing had to be re-issued.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep in sync with config.py's default -- an env var here silently
          # overrides it, and a stale value once left the dashboard telling
          # users one threshold while the code alerted on another.
          SPIKE_THRESHOLD_PCT: "0.10"
          RESULTS_CHECK_INTERVAL_HOURS: "3"
          # Deliberately NOT setting POLL_INTERVAL_MINUTES: setting it here
          # would override cadence.json and reintroduce exactly the drift
          # between advertised and actual cadence that this design removes.
          PUBLISH_INTERVAL_MINUTES: "30"
        run: python runner.py

      # Publish the freshly-rendered dashboard/index.html to GitHub Pages.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Ask GitHub to start the next window, because the schedule above cannot
      # be relied on (see the note at the top of this file).
      #
      # This deliberately requires a token that is NOT the built-in
      # GITHUB_TOKEN: GitHub refuses to let a workflow start another workflow
      # with the built-in one, specifically so a chain like this cannot appear
      # by accident. Until a WORKFLOW_PAT secret exists this step prints a line
      # and exits, so merging it changes nothing on its own.
      #
      # To stop the chain: delete the WORKFLOW_PAT secret, or disable this
      # workflow in the Actions tab. Either takes effect on the next run.
      - name: Queue the next polling window
        if: always()
        env:
          GH_PAT: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "WORKFLOW_PAT is not set -- the cron schedule stays the only trigger."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/poll.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}")
          echo "next window requested, HTTP $status"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch.json
            echo "Could not queue the next run -- check that WORKFLOW_PAT is valid and has Actions: read and write on this repository."
          fi
