name: Poll odds every 30 minutes

# 2026-07-29: switched from OddsPapi (free tier hard-capped at 250
# requests/month total -- nowhere near enough) to The Odds API's paid "20K"
# plan (20,000 credits/month, $30/mo, all bookmakers included). Quota math
# (see README.md "Квота" section): odds-polling every 30 min x ~9 sport keys
# x 1 credit/call =~ 13,000 credits/mo, + results/CLV checking (throttled to
# once every RESULTS_CHECK_INTERVAL_HOURS inside results.py itself) =~ 2,200
# credits/mo -- leaves headroom under the 20K/mo budget.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# pages/id-token are needed by actions/deploy-pages below; contents stays
# read-only because the dashboard is published as a Pages artifact rather than
# committed back to the repo (no commit noise, no push loop).
permissions:
  contents: read
  pages: write
  id-token: write

# If a run somehow takes longer than the 30-minute schedule, don't let runs
# pile up on top of each other -- newest scheduled run wins.
concurrency:
  group: poll-odds
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/cache silently skips the save step if the exact key already
      # exists -- with a fixed key that means the DB would only ever get
      # saved once, and every run after that would "restore" the same stale
      # snapshot forever (spike detection needs the previous run's prices,
      # so this matters). Keying on the run id makes every run's save unique;
      # restore-keys falls back to the most recent previous run's cache.
      - name: Restore odds history DB
        uses: actions/cache@v4
        with:
          path: data
          key: odds-history-db-${{ github.run_id }}
          restore-keys: odds-history-db-

      - run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          # Second provider, esports + table tennis only. The secret already
          # existed from the original OddsPapi build; the same key now carries
          # the paid subscription, so nothing had to be re-issued.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep in sync with config.py's default -- an env var here silently
          # overrides it, and a stale 0.08 left the dashboard telling users
          # "от 8%" while the code was meant to alert from 10%.
          SPIKE_THRESHOLD_PCT: "0.10"
          RESULTS_CHECK_INTERVAL_HOURS: "3"
          POLL_INTERVAL_MINUTES: "30"
        run: python main.py

      # Publish the freshly-rendered dashboard/index.html to GitHub Pages.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
